x-turnip: &turnip
  build: .
  init: true
  read_only: true
  tmpfs:
    - /tmp
  environment: &turnip-environment
    TURNIP_HTTP_ADDR: ":5004"
    TURNIP_REDIS_URL: redis://redis:6379/0
    TURNIP_JWT_SECRET: ${TURNIP_JWT_SECRET:?copy .env.example to .env}
    TURNIP_JWT_ISSUER: ${TURNIP_JWT_ISSUER:-turnip-demo}
    TURNIP_JWT_AUDIENCE: ${TURNIP_JWT_AUDIENCE:-turnip}
    TURNIP_ALLOWED_ORIGINS: http://localhost:8080
    TURNIP_METRICS_ADDR: ":9090"
    TURNIP_LOG_FORMAT: json
    TURNIP_VERSION: 0.1.0-dev
  depends_on:
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    restart: unless-stopped

  turnip-1:
    <<: *turnip
    environment:
      <<: *turnip-environment
      TURNIP_INSTANCE_ID: turnip-1
    ports:
      - "127.0.0.1:5004:5004"
      - "127.0.0.1:9090:9090"

  turnip-2:
    <<: *turnip
    environment:
      <<: *turnip-environment
      TURNIP_INSTANCE_ID: turnip-2
    ports:
      - "127.0.0.1:5005:5004"
      - "127.0.0.1:9091:9090"

  demo-client:
    image: nginx:1.29-alpine
    volumes:
      - ./client.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "127.0.0.1:8080:80"
    restart: unless-stopped
