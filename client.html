<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Turnip v1 protocol client</title>
    <style>
      :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
      body { max-width: 52rem; margin: 2rem auto; padding: 0 1rem; }
      section { border: 1px solid #8886; border-radius: .75rem; padding: 1rem; margin: 1rem 0; }
      label { display: block; margin: .75rem 0; }
      input, textarea { box-sizing: border-box; width: 100%; padding: .55rem; }
      textarea { min-height: 7rem; font-family: ui-monospace, monospace; }
      button { padding: .55rem .85rem; margin-right: .4rem; }
      #messages { min-height: 14rem; max-height: 28rem; overflow: auto; white-space: pre-wrap; font-family: ui-monospace, monospace; }
      .error { color: #e44; }
      .status { font-weight: 700; }
    </style>
  </head>
  <body>
    <h1>Turnip v1 protocol client</h1>
    <p>This development client relays JSON signaling payloads. Generate room-scoped tokens with <code>make token</code>.</p>

    <section>
      <label>Server URL <input id="server" value="ws://localhost:5004/v1/ws" /></label>
      <label>JWT <input id="token" autocomplete="off" /></label>
      <button id="connect">Connect</button>
      <button id="disconnect" disabled>Disconnect</button>
      <p id="status" class="status">Disconnected</p>
    </section>

    <section>
      <label>Target participant ID <input id="target" /></label>
      <label>JSON payload <textarea id="payload">{"kind":"offer","sdp":"example"}</textarea></label>
      <button id="send" disabled>Send signal</button>
      <button id="disband" disabled>Disband room</button>
    </section>

    <section>
      <button id="clear">Clear</button>
      <div id="messages" aria-live="polite"></div>
    </section>

    <script>
      "use strict";
      let socket;
      let request = 0;
      const byId = (id) => document.getElementById(id);

      function log(message, error = false) {
        const row = document.createElement("div");
        row.className = error ? "error" : "";
        row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
        byId("messages").appendChild(row);
        row.scrollIntoView({ block: "nearest" });
      }

      function connected(value) {
        byId("connect").disabled = value;
        byId("disconnect").disabled = !value;
        byId("send").disabled = !value;
        byId("disband").disabled = !value;
        byId("status").textContent = value ? "Connected" : "Disconnected";
      }

      byId("connect").addEventListener("click", () => {
        const server = byId("server").value.trim();
        const token = byId("token").value.trim();
        if (!server || !token) return log("Server URL and JWT are required", true);
        const url = new URL(server);
        url.searchParams.set("token", token);
        socket = new WebSocket(url);
        socket.addEventListener("open", () => connected(true));
        socket.addEventListener("message", ({ data }) => {
          try {
            const message = JSON.parse(data);
            log(`${message.type}: ${JSON.stringify(message.data)}`, message.type === "error");
            if (message.type === "ready") {
              const other = message.data.participants.find((participant) => participant.id !== message.data.participant_id);
              if (other) byId("target").value = other.id;
            }
            if (message.type === "participant_joined" && !byId("target").value) byId("target").value = message.data.id;
            if (message.type === "participant_left" && byId("target").value === message.data.id) byId("target").value = "";
          } catch {
            log(`Invalid server message: ${data}`, true);
          }
        });
        socket.addEventListener("close", ({ code, reason }) => {
          connected(false);
          log(`Closed (${code}${reason ? `: ${reason}` : ""})`);
        });
        socket.addEventListener("error", () => log("WebSocket error", true));
      });

      byId("disconnect").addEventListener("click", () => socket?.close(1000, "client disconnect"));
      byId("send").addEventListener("click", () => {
        try {
          const payload = JSON.parse(byId("payload").value);
          socket.send(JSON.stringify({
            id: `demo-${++request}`,
            type: "signal",
            data: { to: byId("target").value.trim(), payload },
          }));
        } catch (error) {
          log(`Payload must be JSON: ${error.message}`, true);
        }
      });
      byId("disband").addEventListener("click", () => {
        if (window.confirm("Disband this room for every participant?")) {
          socket.send(JSON.stringify({ id: `demo-${++request}`, type: "disband_room", data: {} }));
        }
      });
      byId("clear").addEventListener("click", () => { byId("messages").textContent = ""; });
    </script>
  </body>
</html>
